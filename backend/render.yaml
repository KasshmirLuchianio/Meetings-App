# ============================================================
# Meetings.ro — Render Deploy Config
# FastAPI on Render FREE plan + MongoDB Atlas M0 (extern, gratuit)
#
# ⚠️ Planul free NU are disc persistent: tot ce e scris local
# (inclusiv un MongoDB local) se ȘTERGE la fiecare restart /
# spin-down. De aceea baza de date TREBUIE să fie externă
# (MongoDB Atlas M0 — gratuit). Vezi backend/FREE_PLAN_SETUP.md.
# ============================================================

services:
  - type: web
    name: meetings-ro-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    region: frankfurt  # eu-central — closest to Romania (și la Atlas Frankfurt)
    plan: free         # 512MB RAM; spin-down după 15 min inactivitate
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true

    # ---------- Environment variables ----------
    envVars:
      - key: MONGO_URL
        sync: false                   # MongoDB Atlas URI (mongodb+srv://...) — set in dashboard
      - key: DB_NAME
        value: gal_meetings
      - key: OPENAI_API_KEY
        sync: false                   # Set manually in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false                   # Set manually in Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false                   # Set manually in Render dashboard
      - key: STRIPE_WEBHOOK_SECRET
        sync: false                   # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false                   # Set manually in Render dashboard
      # ---------- Transactional email (privateemail SMTP) ----------
      - key: SMTP_HOST
        value: mail.privateemail.com  # Namecheap Private Email
      - key: SMTP_PORT
        value: "465"                  # 465 = SSL
      - key: SMTP_USER
        sync: false                   # contact@meetings-ro.app — set in Render dashboard
      - key: SMTP_PASSWORD
        sync: false                   # mailbox password — set in Render dashboard (secret!)
      - key: SMTP_FROM_NAME
        value: Meetings.ro
      - key: SMTP_FROM_EMAIL
        value: contact@meetings-ro.app
      - key: RESEND_API_KEY
        sync: false                   # optional fallback — set in Render dashboard
      # ---------- Daily MongoDB backup → S3 (optional, recomandat) ----------
      - key: AWS_ACCESS_KEY_ID
        sync: false                   # IAM user cu acces doar la bucket-ul de backup
      - key: AWS_SECRET_ACCESS_KEY
        sync: false                   # secret!
      - key: S3_BACKUP_BUCKET
        sync: false                   # ex: meetings-ro-backups
      - key: AWS_REGION
        value: eu-central-1
      - key: PORT
        value: "8000"
      - key: TZ
        value: Europe/Bucharest
