[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mongodb]
command=mongod --dbpath /data/db --bind_ip 127.0.0.1 --port 27017 --noauth --quiet
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/mongodb.log
stderr_logfile=/var/log/supervisor/mongodb_err.log
startsecs=5

[program:fastapi]
command=uvicorn server:app --host 0.0.0.0 --port 8000 --workers 2
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=10
stdout_logfile=/var/log/supervisor/fastapi.log
stderr_logfile=/var/log/supervisor/fastapi_err.log
environment=DB_NAME="gal_meetings"
