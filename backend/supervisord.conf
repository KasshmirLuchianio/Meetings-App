[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; All program output goes to the container's stdout so it shows up in
; Render's "Logs" tab (log files inside the container were invisible there).

[program:fastapi]
command=uvicorn server:app --host 0.0.0.0 --port 8000 --workers %(ENV_UVICORN_WORKERS)s
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; mongodb (only with local MONGO_URL) and mongo_backup (only when S3 backup
; env vars are set) are generated by entrypoint.sh into this directory.
[include]
files = /etc/supervisor/conf.d/extra/*.conf
