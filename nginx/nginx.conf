# Nginx reverse proxy for on-premise Meetings Platform
# - /api/* → backend:8000
# - /* → web frontend (when built)
# - SSL termination with institution certificate

server {
    listen 80;
    server_name _;
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 150M;  # allow large audio uploads

    # Backend API
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # long timeout for AI processing
        proxy_send_timeout 300s;
    }

    # Legal pages served by backend
    location ~ ^/(privacy|terms) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Web frontend (static files — add when Next.js is built)
    location / {
        # Uncomment when web frontend container is added:
        # proxy_pass http://web:3000;
        return 200 '{"service":"Meetings Platform","status":"ok"}';
        add_header Content-Type application/json;
    }
}
